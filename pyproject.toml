[project]
name = "simulation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.13.0",
    "langchain>=1.3.9",
    "langchain-google-genai>=4.2.5",
    "mcp[cli]>=1.27.2",
    "opencv-python>=4.13.0.92",
    "pygame>=2.6.1",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
    "torch>=2.12.0",
    "torchvision",
    "timm",
    "transformers>=5.12.0",
    "ollama>=0.6.2",
    "openpyxl>=3.1.5",
    "langchain-ollama>=1.1.0",
    "pocket-tts>=2.1.0",
]

# CUDA (cu126) wheels only exist for Linux x86_64, so the index is restricted to that
# exact platform via a marker. Everything else (macOS/Apple Silicon, and Linux
# aarch64 — e.g. a native arm64 Docker container on an Apple Silicon Mac) falls back
# to the standard PyPI torch/torchvision build: MPS-enabled on macOS, CPU-only on
# Linux aarch64 (no GPU passthrough exists there anyway).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and python_version == '3.13' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and python_version == '3.13' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and python_version == '3.13' and platform_machine == 'arm64'",
]
override-dependencies = [
    "numpy>=2.0.0",
]



